name: Fetch EB11 text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download slices from Project Gutenberg
        run: python fetch_eb11.py

      - name: Commit downloaded files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add eb11 manifest.csv
          git commit -m "Add EB11 plain text files" || echo "Nothing new to commit"
          git push
