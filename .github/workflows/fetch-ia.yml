name: Fetch IA text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download volumes from the Internet Archive
        run: python fetch_ia.py

      - name: Commit downloaded files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add eb11_ia manifest_ia.csv
          git commit -m "Add Internet Archive EB11 volumes" || echo "Nothing new to commit"
          git push || echo "Push failed (see log)"
